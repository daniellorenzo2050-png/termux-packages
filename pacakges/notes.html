<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        /* Estilos globais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container principal para o conteúdo */
        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Estilo para o título principal (h1) */
        h1 {
            color: #e74c3c;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        /* Estilo para o subtítulo (h2) */
        h2 {
            color: #2c3e50;
            font-size: 1.2rem;
            font-weight: normal;
            line-height: 1.5;
            margin-bottom: 30px;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Essa pasta guarda os pacotes do app para Termux no repositório <strong>termux-packages</strong>.</h2>
        <h1>A gente foi avisar vocês, então tchau!</h1>
    </div>

</body>
</html>
